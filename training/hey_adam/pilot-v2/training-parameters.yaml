window_step_ms: 10
train_dir: trained_models/pilot-v2
features:
- features_dir: features/positives
  sampling_weight: 2.0
  penalty_weight: 1.0
  truth: true
  truncation_strategy: truncate_start
  type: mmap
- features_dir: features/near_misses
  sampling_weight: 2.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: truncate_start
  type: mmap
- features_dir: negative_datasets/speech
  sampling_weight: 10.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: negative_datasets/dinner_party
  sampling_weight: 10.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: negative_datasets/no_speech
  sampling_weight: 5.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: negative_datasets/dinner_party_eval
  sampling_weight: 0.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: split
  type: mmap
training_steps:
- 500
batch_size: 128
learning_rates:
- 0.001
positive_class_weight:
- 1
negative_class_weight:
- 20
time_mask_max_size:
- 0
time_mask_count:
- 0
freq_mask_max_size:
- 0
freq_mask_count:
- 0
eval_step_interval: 500
clip_duration_ms: 1500
target_minimization: 0.9
minimization_metric: null
maximization_metric: average_viable_recall
warm_start_provenance:
  source_weights: results/pilot-v1-before-continuation.weights.h5
  source_step: 9500
  additional_steps: 500
  optimizer: Fresh Adam optimizer
